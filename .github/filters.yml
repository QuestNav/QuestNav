# dorny/paths-filter definitions shared by ci.yml and release.yml.
# Generated proto code is not committed, so proto changes count as Java and C# changes.
ci:
  - '.github/actions/**'
  - '.github/workflows/**'
  - '.github/filters.yml'
proto: &proto
  - 'protos/**'
java:
  - *proto
  - 'questnav-lib/**/*.java'
  - 'questnav-lib/**/*.gradle'
  - 'questnav-lib/gradle.properties'
  - 'questnav-lib/src/generate/**'
csharp:
  - *proto
  - 'unity/**/*.cs'
  - 'unity/**/*.json'
  - 'unity/**/*.unity'
  - 'unity/**/*.meta'
  - 'unity/**/*.asmdef'
  - 'unity/Assets/Plugins/**'
docs:
  - 'docs/**'
web-ui:
  - 'questnav-web-ui/**'
  - 'unity/Assets/StreamingAssets/ui/**'
