name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
# ----------------------- DETECT CHANGES ----------------------- #
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      ci-changed: ${{ steps.changes.outputs.ci }}
      java-changed: ${{ steps.changes.outputs.java }}
      csharp-changed: ${{ steps.changes.outputs.csharp }}
      proto-changed: ${{ steps.changes.outputs.proto }}
      docs-changed: ${{ steps.changes.outputs.docs }}
      web-ui-changed: ${{ steps.changes.outputs.web-ui }}
    steps:
      - uses: actions/checkout@v7
      
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: .github/filters.yml


# ----------------------- JAVA ----------------------- #
  build-proto-java:
    if: |
      needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.proto-changed == 'true' ||
      needs.detect-changes.outputs.csharp-changed == 'true' ||
      needs.detect-changes.outputs.java-changed == 'true' ||
      needs.detect-changes.outputs.web-ui-changed == 'true' ||
      needs.detect-changes.outputs.docs-changed == 'true'
    needs: [detect-changes]
    uses: ./.github/workflows/reusable-build-proto-java.yml

  format-java:
    if: |
      needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.java-changed == 'true'
    needs: [detect-changes, build-proto-java]
    uses: ./.github/workflows/reusable-format-java.yml

  docs-java:
    if: |
      needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.java-changed == 'true'
    needs: [detect-changes, build-proto-java]
    uses: ./.github/workflows/reusable-docs-javadoc.yml

  build-java:
    if: |
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.java-changed == 'true' ||
      needs.detect-changes.outputs.csharp-changed == 'true' ||
      needs.detect-changes.outputs.web-ui-changed == 'true')
    needs: [detect-changes, build-proto-java, format-java, docs-java]
    uses: ./.github/workflows/reusable-build-java.yml

  publish-java:
    if: |
      !cancelled() &&
      needs.build-java.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: [build-java]
    uses: ./.github/workflows/reusable-publish-java.yml
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

# ----------------------- C# ----------------------- #
  build-proto-csharp:
    if: |
      needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.proto-changed == 'true' ||
      needs.detect-changes.outputs.csharp-changed == 'true' ||
      needs.detect-changes.outputs.java-changed == 'true' ||
      needs.detect-changes.outputs.web-ui-changed == 'true' ||
      needs.detect-changes.outputs.docs-changed == 'true'
    needs: [detect-changes]
    uses: ./.github/workflows/reusable-build-proto-csharp.yml
    
  format-csharp:
    if: |
      needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.csharp-changed == 'true'
    needs: [detect-changes, build-proto-csharp, build-web-ui]
    uses: ./.github/workflows/reusable-format-csharp.yml

  docs-csharp:
    if: |
      needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.csharp-changed == 'true'
    needs: [detect-changes, build-proto-csharp, build-web-ui]
    uses: ./.github/workflows/reusable-docs-docfx.yml

  build-csharp:
    if: |
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)) &&
      (needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.csharp-changed == 'true' ||
      needs.detect-changes.outputs.java-changed == 'true' ||
      needs.detect-changes.outputs.web-ui-changed == 'true')
    needs: [detect-changes, docs-csharp, format-csharp]
    uses: QuestNav/QuestNav/.github/workflows/development-apk.yml@main
    permissions: {}

  test-csharp:
    # Dependabot runs get no Actions secrets, so the Unity license can't activate.
    if: |
      github.actor != 'dependabot[bot]' &&
      (((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)) &&
      (needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.csharp-changed == 'true'))
    needs: [detect-changes, build-proto-csharp, build-web-ui]
    uses: ./.github/workflows/reusable-test-csharp.yml
    permissions:
      contents: read
      checks: write
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

# ----------------------- WEB UI ----------------------- #
  build-web-ui:
    if: |
      needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.web-ui-changed == 'true' ||
      needs.detect-changes.outputs.csharp-changed == 'true' ||
      needs.detect-changes.outputs.java-changed == 'true' ||
      needs.detect-changes.outputs.docs-changed == 'true'
    needs: [detect-changes]
    uses: ./.github/workflows/reusable-build-web-ui.yml

  
# ----------------------- PROTOBUF ----------------------- #
  docs-proto:
    if: |
      needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.proto-changed == 'true'
    needs: [detect-changes]
    uses: ./.github/workflows/reusable-docs-proto.yml

  # ----------------------- DOCS ----------------------- #
  build-docs:
    if: |
      (needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.docs-changed == 'true') &&
      github.event_name == 'pull_request'
    needs: [detect-changes]
    uses: ./.github/workflows/reusable-docs-docs.yml

  publish-docs:
    if: |
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      needs.detect-changes.outputs.docs-changed == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: [build-proto-java, build-proto-csharp, build-web-ui, detect-changes]
    uses: ./.github/workflows/reusable-publish-docs.yml
    permissions:
      contents: write
      pages: write
      id-token: write

  # ----------------------- SUMMARY ----------------------- #
  ci-summary:
    if: always()
    needs:
      - detect-changes
      - format-java
      - build-java
      - docs-java
      - format-csharp
      - build-csharp
      - test-csharp
      - docs-csharp
      - build-proto-java
      - build-proto-csharp
      - docs-proto
      - build-docs
      - build-web-ui
      - publish-java
      - publish-docs
    runs-on: ubuntu-latest
    steps:
      - name: Generate CI Summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "# CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "- CI configuration: \`${{ needs.detect-changes.outputs.ci-changed }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Java: \`${{ needs.detect-changes.outputs.java-changed }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- C#: \`${{ needs.detect-changes.outputs.csharp-changed }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Proto: \`${{ needs.detect-changes.outputs.proto-changed }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Docs: \`${{ needs.detect-changes.outputs.docs-changed }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Web UI: \`${{ needs.detect-changes.outputs.web-ui-changed }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "$NEEDS" | jq -r 'to_entries[] | "- \(.key): `\(.value.result)`"' >> $GITHUB_STEP_SUMMARY

      # Skipped jobs are fine; this makes ci-summary usable as the single required check.
      - name: Fail on failed or cancelled jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs failed or were cancelled."
          exit 1
