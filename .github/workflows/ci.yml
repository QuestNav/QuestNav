name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
# ----------------------- DETECT CHANGES ----------------------- #
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      ci-changed: ${{ steps.changes.outputs.ci }}
      java-changed: ${{ steps.changes.outputs.java }}
      csharp-changed: ${{ steps.changes.outputs.csharp }}
      proto-changed: ${{ steps.changes.outputs.proto }}
      docs-changed: ${{ steps.changes.outputs.docs }}
      web-ui-changed: ${{ steps.changes.outputs.web-ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          filters: |
            ci:
              - '.github/actions/**'
              - '.github/scripts/**'
              - '.github/workflows/**'
            java:
              - 'questnav-lib/**/*.java'
              - 'questnav-lib/**/*.gradle'
            csharp:
              - 'unity/**/*.cs'
              - 'unity/**/*.json'
              - 'unity/**/*.unity'
              - 'unity/**/*.meta'
              - 'unity/**/*.asmdef'
            proto:
              - 'protos/*.proto'
            docs:
              - 'docs/**'
            web-ui:
              - 'questnav-web-ui/**'
              - 'unity/Assets/StreamingAssets/ui/**'


# ----------------------- JAVA ----------------------- #
  build-proto-java:
    if: |
      needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.proto-changed == 'true' ||
      needs.detect-changes.outputs.csharp-changed == 'true' ||
      needs.detect-changes.outputs.java-changed == 'true' ||
      needs.detect-changes.outputs.web-ui-changed == 'true'
    needs: [detect-changes]
    uses: ./.github/workflows/reusable-build-proto-java.yml

  format-java:
    if: |
      needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.java-changed == 'true'
    needs: [detect-changes, build-proto-java]
    uses: ./.github/workflows/reusable-format-java.yml

  docs-java:
    if: |
      needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.java-changed == 'true'
    needs: [detect-changes, build-proto-java]
    uses: ./.github/workflows/reusable-docs-javadoc.yml

  build-java:
    if: |
      always() &&
      (needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.java-changed == 'true' ||
      needs.detect-changes.outputs.csharp-changed == 'true' ||
      needs.detect-changes.outputs.web-ui-changed == 'true') &&
      (needs.format-java.result != 'failure' &&
      needs.docs-java.result != 'failure')
    needs: [detect-changes, format-java, docs-java]
    uses: ./.github/workflows/reusable-build-java.yml

  publish-java:
    if: |
      always() &&
      needs.build-java.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: [build-java]
    uses: ./.github/workflows/reusable-publish-java.yml

# ----------------------- C# ----------------------- #
  build-proto-csharp:
    if: |
      needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.proto-changed == 'true' ||
      needs.detect-changes.outputs.csharp-changed == 'true' ||
      needs.detect-changes.outputs.java-changed == 'true' ||
      needs.detect-changes.outputs.web-ui-changed == 'true'
    needs: [detect-changes]
    uses: ./.github/workflows/reusable-build-proto-csharp.yml
    
  format-csharp:
    if: |
      needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.csharp-changed == 'true'
    needs: [detect-changes, build-proto-csharp, build-web-ui]
    uses: ./.github/workflows/reusable-format-csharp.yml

  docs-csharp:
    if: |
      needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.csharp-changed == 'true'
    needs: [detect-changes, build-proto-csharp, build-web-ui]
    uses: ./.github/workflows/reusable-docs-docfx.yml

  build-csharp:
    if: |
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)) &&
      (needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.csharp-changed == 'true' ||
      needs.detect-changes.outputs.java-changed == 'true' ||
      needs.detect-changes.outputs.web-ui-changed == 'true') &&
      (needs.format-csharp.result != 'failure' &&
      needs.docs-csharp.result != 'failure')
    needs: [detect-changes, docs-csharp, format-csharp]
    uses: QuestNav/QuestNav/.github/workflows/development-apk.yml@main
    permissions: {}

  test-csharp:
    if: |
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)) &&
      (needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.csharp-changed == 'true')
    needs: [detect-changes, build-proto-csharp, build-web-ui]
    uses: ./.github/workflows/reusable-test-csharp.yml
    permissions:
      contents: read
      checks: write
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

# ----------------------- WEB UI ----------------------- #
  build-web-ui:
    if: |
      needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.web-ui-changed == 'true' ||
      needs.detect-changes.outputs.csharp-changed == 'true' ||
      needs.detect-changes.outputs.java-changed == 'true'
    needs: [detect-changes]
    uses: ./.github/workflows/reusable-build-web-ui.yml

  
# ----------------------- PROTOBUF ----------------------- #
  docs-proto:
    if: |
      needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.proto-changed == 'true'
    needs: [detect-changes]
    uses: ./.github/workflows/reusable-docs-proto.yml

  # ----------------------- DOCS ----------------------- #
  build-docs:
    if: |
      (needs.detect-changes.outputs.ci-changed == 'true' ||
      needs.detect-changes.outputs.docs-changed == 'true') &&
      github.event_name == 'pull_request'
    needs: [detect-changes]
    uses: ./.github/workflows/reusable-docs-docs.yml

  publish-docs:
    if: |
      needs.detect-changes.outputs.docs-changed == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: [build-proto-java, build-proto-csharp, build-web-ui, detect-changes]
    uses: ./.github/workflows/reusable-publish-docs.yml
    permissions:
      contents: write
      pages: write
      id-token: write

  # ----------------------- SUMMARY ----------------------- #
  ci-summary:
    if: always()
    needs:
      - detect-changes
      - format-java
      - build-java
      - docs-java
      - format-csharp
      - build-csharp
      - test-csharp
      - docs-csharp
      - build-proto-java
      - build-proto-csharp
      - docs-proto
      - build-docs
      - build-web-ui
    runs-on: ubuntu-latest
    steps:
      - name: Generate CI Summary
        env:
          APK_RESULT: ${{ needs.build-csharp.result }}
          INTERNAL: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          APK_INPUTS_CHANGED: ${{ needs.detect-changes.outputs.ci-changed == 'true' || needs.detect-changes.outputs.csharp-changed == 'true' || needs.detect-changes.outputs.java-changed == 'true' || needs.detect-changes.outputs.web-ui-changed == 'true' }}
          DETECTION: ${{ needs.detect-changes.result }}
          FORMAT: ${{ needs.format-csharp.result }}
          DOCS: ${{ needs.docs-csharp.result }}
        run: |
          {
            echo "# CI Pipeline Summary"
            echo ""
            echo "Development APK: **$APK_RESULT**"
            if [[ "$APK_RESULT" == skipped ]]; then
              if [[ "$INTERNAL" != true ]]; then
                echo "Fork builds require a maintainer dispatch."
              elif [[ "$DETECTION" != success ]]; then
                echo "Change detection concluded $DETECTION."
              elif [[ "$APK_INPUTS_CHANGED" != true ]]; then
                echo "No qualifying build inputs changed."
              else
                echo "Upstream C# formatting: $FORMAT. Documentation: $DOCS."
              fi
            fi
            echo ""
            echo "## Changes Detected"
            echo "- CI configuration: \`${{ needs.detect-changes.outputs.ci-changed }}\`"
            echo "- Java: \`${{ needs.detect-changes.outputs.java-changed }}\`"
            echo "- C#: \`${{ needs.detect-changes.outputs.csharp-changed }}\`"
            echo "- Proto: \`${{ needs.detect-changes.outputs.proto-changed }}\`"
            echo "- Docs: \`${{ needs.detect-changes.outputs.docs-changed }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require successful CI jobs
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          jq -e '."detect-changes".result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<< "$JOBS"
