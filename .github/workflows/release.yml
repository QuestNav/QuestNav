name: Publish Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string to use [YEAR]-[MAJOR].[MINOR].[PATCH]-[TYPE] (optional, auto-generated if not provided)'
        required: false
        type: string
        default: '2025-1.0.0-beta'
      force-release:
        description: 'Force publishing of all jobs'
        required: true
        type: boolean
        default: false
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  determine-publishable-changes:
    runs-on: ubuntu-latest
    outputs:
      java-changed: ${{ steps.changes.outputs.java }}
      csharp-changed: ${{ steps.changes.outputs.csharp }}
      proto-changed: ${{ steps.changes.outputs.proto }}
      docs-changed: ${{ steps.changes.outputs.docs }}
      web-ui-changed: ${{ steps.changes.outputs.web-ui }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
    
      - name: Get last release tag
        id: get-last-release
        uses: WyriHaximus/github-action-get-previous-tag@v2

      - name: Determine publishable changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            java:
              - 'questnav-lib/**.java'
              - 'questnav-lib/**.gradle'
            csharp:
              - 'unity/**.cs'
              - 'unity/**.json'
              - 'unity/**.unity'
              - 'unity/**.meta'
            proto:
              - 'protos/**'
            docs:
              - 'docs/**'
            web-ui:
              - 'questnav-web-ui/**'
              - 'unity/Assets/StreamingAssets/ui/**'
          base: ${{ steps.get-last-release.outputs.tag }}

  build-proto-java:
    needs: [determine-publishable-changes]
    uses: ./.github/workflows/reusable-build-proto-java.yml
    with:
      version: ${{ inputs.version }}

  build-proto-csharp:
    needs: [determine-publishable-changes]
    uses: ./.github/workflows/reusable-build-proto-csharp.yml
    with:
      version: ${{ inputs.version }}

  build-web-ui:
    if: |
      (needs.determine-publishable-changes.outputs.web-ui-changed == 'true' ||
      needs.determine-publishable-changes.outputs.csharp-changed == 'true' ||
      needs.determine-publishable-changes.outputs.java-changed == 'true' ||
      needs.determine-publishable-changes.outputs.docs-changed == 'true') ||
      inputs.force-release
    needs: [determine-publishable-changes]
    uses: ./.github/workflows/reusable-build-web-ui.yml
    with:
      version: ${{inputs.version}}

  build-apk:
    if: |
      (needs.determine-publishable-changes.outputs.csharp-changed == 'true' ||
      needs.determine-publishable-changes.outputs.java-changed == 'true' ||
      needs.determine-publishable-changes.outputs.web-ui-changed == 'true') ||
      inputs.force-release
    needs: [build-proto-csharp, build-web-ui, determine-publishable-changes]
    uses: ./.github/workflows/reusable-build-csharp.yml
    with:
      version: ${{ inputs.version }}
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

  sign-apk:
    needs: build-apk
    runs-on: ubuntu-24.04
    environment: android-release
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download this build's APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build-apk.outputs.apk-artifact-id }}
          merge-multiple: true
          path: candidate

      - name: Sign and verify the release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
          RELEASE_VERSION: ${{ needs.build-apk.outputs.version }}
          RELEASE_CODE: ${{ needs.build-apk.outputs.version-code }}
        run: bash .github/scripts/sign-release-apk.sh candidate signed

      - name: Upload signed Android.apk
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: questnav-apk-${{ needs.build-apk.outputs.version }}
          path: signed/Android.apk
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  publish-docs:
    if: |
      (needs.determine-publishable-changes.outputs.docs-changed == 'true') ||
      inputs.force-release
    needs: [build-proto-java, build-proto-csharp, build-web-ui, determine-publishable-changes]
    uses: ./.github/workflows/reusable-publish-docs.yml
    permissions:
      contents: write
      pages: write
      id-token: write
    with:
      version: ${{ inputs.version }}
  
  publish-java:
    if: |
      (needs.determine-publishable-changes.outputs.java-changed == 'true' ||
      needs.determine-publishable-changes.outputs.csharp-changed == 'true' ||
      needs.determine-publishable-changes.outputs.web-ui-changed == 'true') ||
      inputs.force-release
    needs: [build-proto-java, determine-publishable-changes]
    uses: ./.github/workflows/reusable-publish-java.yml
    with:
      version: ${{ inputs.version }}
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

  github-release:
    if: |
      (needs.determine-publishable-changes.outputs.csharp-changed == 'true' ||
      needs.determine-publishable-changes.outputs.java-changed == 'true' ||
      needs.determine-publishable-changes.outputs.web-ui-changed == 'true') ||
      inputs.force-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [sign-apk, publish-docs, publish-java, determine-publishable-changes]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Determine Version
        id: version-info
        uses: ./.github/actions/determine-version
        with:
          version: ${{ inputs.version }}

      - name: Require a signed APK artifact
        # An empty artifact-ids input would download every artifact in the run.
        env:
          ARTIFACT_ID: ${{ needs.sign-apk.outputs.artifact-id }}
        shell: bash
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Missing signed APK artifact ID' >&2; exit 1; }

      - name: Download signed Android.apk
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.sign-apk.outputs.artifact-id }}
          merge-multiple: true
          path: release/apk

      - name: Download Vendor JSON
        uses: actions/download-artifact@v8
        with:
          name: 'questnav-json-${{ steps.version-info.outputs.version }}'
          path: release/vendor

      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          tag_name: ${{ steps.version-info.outputs.version }}
          files: |
            release/apk/Android.apk
            release/vendor/*.json
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}
