name: Build release APK

on:
  workflow_call:
    inputs:
      version:
        description: Release version
        type: string
    outputs:
      version:
        value: ${{ jobs.version.outputs.name }}
      version-code:
        value: ${{ jobs.version.outputs.code }}
      apk-artifact-id:
        value: ${{ jobs.build.outputs.artifact-id }}

permissions: {}

jobs:
  version:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.workflow_ref == 'QuestNav/QuestNav/.github/workflows/release.yml@refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.version-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: version
        uses: ./.github/actions/determine-version
        with:
          version: ${{ inputs.version }}

  build:
    needs: version
    uses: QuestNav/QuestNav/.github/workflows/development-apk.yml@main
    with:
      release-version: ${{ needs.version.outputs.name }}
      release-version-code: ${{ needs.version.outputs.code }}
