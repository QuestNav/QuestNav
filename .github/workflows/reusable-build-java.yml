name: Build Java

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string to use (optional, auto-generated if not provided)'
        required: false
        type: string
    outputs:
      version:
        description: 'The version string used for this build'
        value: ${{ jobs.build.outputs.version }}
      artifact-id:
        description: 'The artifact ID for the JAR'
        value: ${{ jobs.build.outputs.artifact-id }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: questnav-lib
    outputs:
      version: ${{ steps.version-info.outputs.version }}
      artifact-id: ${{ steps.upload-jar.outputs.artifact-id }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            questnav-lib
            .github
          sparse-checkout-cone-mode: false

      - name: Determine Version
        id: version-info
        uses: ./.github/actions/determine-version
        with:
          version: ${{ inputs.version }}

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          version: ${{ steps.version-info.outputs.version }}
          working-directory: questnav-lib
          cache-key-prefix: gradle-lib

      - name: Build Library
        run: |
          ./gradlew build \
            -Pversion="${{ steps.version-info.outputs.version }}" \
            -PversionType="${{ steps.version-info.outputs.version-type }}"

      - name: Check Vendor JSON
        uses: ./.github/actions/check-vendor-json
        with:
          version: ${{ steps.version-info.outputs.version }}
          version-type: ${{ steps.version-info.outputs.version-type }}
          year: ${{ steps.version-info.outputs.year }}

      # Exercises the publish configuration without credentials
      - name: Publish to Local File Repository
        run: |
          REPO="${{ runner.temp }}/questnav-maven"
          ./gradlew publish \
            -Pversion="${{ steps.version-info.outputs.version }}" \
            -PversionType="${{ steps.version-info.outputs.version-type }}" \
            -PmavenRepoUrl="file://$REPO"
          find "$REPO" -name 'questnavlib-java-*.jar' | grep -q . || { echo "::error::questnavlib-java jar was not published"; exit 1; }
          find "$REPO" -name 'questnavlib-json-*.json' | grep -q . || { echo "::error::questnavlib-json was not published"; exit 1; }

      - name: Upload JAR Artifact
        id: upload-jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: questnav-jar-${{ steps.version-info.outputs.version }}
          path: questnav-lib/build/libs/*.jar
          retention-days: 7