name: Build Proto (Java)

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string to use (optional, auto-generated if not provided)'
        required: false
        type: string

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            questnav-lib
            protos
            .github
          sparse-checkout-cone-mode: false

      - name: Determine Version
        id: version-info
        uses: ./.github/actions/determine-version
        with:
          version: ${{ inputs.version }}

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # SHA-256 computed from Maven Central; its published .sha1 matches the same file.
      - name: Download QuickBuf plugin
        env:
          QUICKBUF_URL: https://repo1.maven.org/maven2/us/hebi/quickbuf/protoc-gen-quickbuf/1.4/protoc-gen-quickbuf-1.4-linux-x86_64.exe
          QUICKBUF_SHA256: 641f66130f048571ae44b7afb7756a46a69fa6d5c64c26bc39ce0cb385c2e8f8
        run: |
          mkdir -p "$RUNNER_TEMP/quickbuf"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/quickbuf/protoc-gen-quickbuf" "$QUICKBUF_URL"
          echo "$QUICKBUF_SHA256  $RUNNER_TEMP/quickbuf/protoc-gen-quickbuf" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/quickbuf/protoc-gen-quickbuf"

      - name: Generate Java QuickBuffers
        run: |
          protoc \
          --proto_path=protos \
          --plugin=protoc-gen-quickbuf="$RUNNER_TEMP/quickbuf/protoc-gen-quickbuf" \
          --quickbuf_out=gen_descriptors=true,indent=4:questnav-lib/src/main/java/ \
          protos/data.proto protos/commands.proto

      - name: Upload Generated Proto Files
        uses: actions/upload-artifact@v7
        with:
          name: questnav-proto-java-${{ steps.version-info.outputs.version }}
          path: questnav-lib/src/main/java/gg/questnav/questnav/protos/generated
          retention-days: 7