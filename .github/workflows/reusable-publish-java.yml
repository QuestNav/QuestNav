name: Publish QuestNavLib

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string to use (optional, auto-generated if not provided)'
        required: false
        type: string

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: ${{ github.event_name == 'push' && 'maven-snapshots' || 'maven-releases' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: questnav-lib

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            questnav-lib
            .github
          sparse-checkout-cone-mode: false

      - name: Determine Version
        id: version-info
        uses: ./.github/actions/determine-version
        with:
          version: ${{ inputs.version }}

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          version: ${{ steps.version-info.outputs.version }}
          working-directory: questnav-lib
          cache-key-prefix: gradle-publish

      - name: Publish to Maven
        env:
          ORG_GRADLE_PROJECT_mavenUsername: ${{ secrets.PUBLISH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenPassword: ${{ secrets.PUBLISH_PASSWORD }}
          VERSION_TYPE: ${{ steps.version-info.outputs.version-type }}
          PROJECT_VERSION: ${{ steps.version-info.outputs.version }}
        run: |
          : "${ORG_GRADLE_PROJECT_mavenUsername:?Missing Maven environment username}"
          : "${ORG_GRADLE_PROJECT_mavenPassword:?Missing Maven environment password}"
          ./gradlew publish -Pversion="$PROJECT_VERSION" -PversionType="$VERSION_TYPE"

      - name: Upload Vendor JSON Artifact
        id: upload-json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: questnav-json-${{ steps.version-info.outputs.version }}
          path: 'questnav-lib/build/generated/vendordeps/*.json'
          retention-days: 7